id = "disk_full"
name = "Disk Space Full"
description = "Fires when disk space usage exceeds a configured threshold"
alert_type = "metric"
variables = ["metric_name", "current_value", "threshold", "asset_name", "operator"]
styles = ["concise", "detailed", "technical"]
channel_hints = ["email", "sms", "im"]

[translations.en-US]
"title.concise" = "Alert: {{.metric_name}}"
"title.detailed" = "Disk alert: {{.metric_name}} at {{.current_value}}"
"title.technical" = "ALERT[metric] {{.metric_name}}={{.current_value}}"
"description.concise" = "{{.metric_name}} = {{.current_value}}"
"description.detailed" = "Asset {{.asset_name}} disk usage is {{.current_value}}, exceeding threshold {{.threshold}} ({{.operator}})."
"description.technical" = "metric={{.metric_name}} value={{.current_value}} threshold={{.threshold}} op={{.operator}}"

[translations.zh-Hans]
"title.concise" = "告警：{{.metric_name}}"
"title.detailed" = "磁盘告警：{{.metric_name}} 达到 {{.current_value}}"
"title.technical" = "ALERT[metric] {{.metric_name}}={{.current_value}}"
"description.concise" = "{{.metric_name}} = {{.current_value}}"
"description.detailed" = "资产 {{.asset_name}} 磁盘使用率 {{.current_value}}，超过阈值 {{.threshold}}（{{.operator}}）。"
"description.technical" = "metric={{.metric_name}} value={{.current_value}} threshold={{.threshold}} op={{.operator}}"
