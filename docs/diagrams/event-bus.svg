<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 460" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Tickraft Event Bus Flow</title>
  <desc>Three independent modules (scheduler, executor, telemetry) communicate only through a strongly typed event bus.</desc>

  <defs>
    <!-- Solid arrowhead -->
    <marker id="arrow-solid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1E40AF"/>
    </marker>
    <!-- Dashed arrowhead -->
    <marker id="arrow-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9CA3AF"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="820" height="460" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="410" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#0F172A">Three-Module Event Bus</text>

  <!-- ===== scheduler node ===== -->
  <g>
    <rect x="40" y="110" width="190" height="90" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
    <text x="135" y="142" text-anchor="middle" font-size="16" font-weight="700" fill="#1E3A8A">scheduler</text>
    <text x="135" y="165" text-anchor="middle" font-size="12" fill="#475569">time wheel</text>
    <text x="135" y="183" text-anchor="middle" font-size="12" fill="#475569">+ sharding</text>
  </g>

  <!-- ===== event bus circle ===== -->
  <g>
    <circle cx="410" cy="155" r="58" fill="#F1F5F9" stroke="#475569" stroke-width="2"/>
    <text x="410" y="150" text-anchor="middle" font-size="14" font-weight="700" fill="#1E293B">event bus</text>
    <text x="410" y="170" text-anchor="middle" font-size="11" fill="#64748B">pkg/event</text>
    <text x="410" y="186" text-anchor="middle" font-size="10" fill="#94A3B8">typed pub/sub</text>
  </g>

  <!-- ===== executor node ===== -->
  <g>
    <rect x="590" y="110" width="190" height="90" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <text x="685" y="142" text-anchor="middle" font-size="16" font-weight="700" fill="#064E3B">executor</text>
    <text x="685" y="165" text-anchor="middle" font-size="12" fill="#475569">worker pool</text>
    <text x="685" y="183" text-anchor="middle" font-size="12" fill="#475569">+ retry</text>
  </g>

  <!-- ===== telemetry node ===== -->
  <g>
    <rect x="310" y="350" width="200" height="80" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <text x="410" y="380" text-anchor="middle" font-size="16" font-weight="700" fill="#92400E">telemetry</text>
    <text x="410" y="402" text-anchor="middle" font-size="12" fill="#475569">listener + aggregator</text>
    <text x="410" y="420" text-anchor="middle" font-size="11" fill="#92400E" font-style="italic">decoupled — subscribes to no scheduler events</text>
  </g>

  <!-- ===== Arrow 1: scheduler → bus (TaskTriggered, upper) ===== -->
  <line x1="232" y1="140" x2="349" y2="140" stroke="#1E40AF" stroke-width="2" marker-end="url(#arrow-solid)"/>
  <text x="290" y="132" text-anchor="middle" font-size="11" font-weight="600" fill="#1E40AF">TaskTriggered</text>

  <!-- ===== Arrow 2: bus → executor (TaskTriggered, upper) ===== -->
  <line x1="471" y1="140" x2="588" y2="140" stroke="#1E40AF" stroke-width="2" marker-end="url(#arrow-solid)"/>
  <text x="529" y="132" text-anchor="middle" font-size="11" font-weight="600" fill="#1E40AF">TaskTriggered</text>

  <!-- ===== Arrow 3: executor → bus (TaskCompleted, lower) ===== -->
  <line x1="588" y1="175" x2="471" y2="175" stroke="#1E40AF" stroke-width="2" marker-end="url(#arrow-solid)"/>
  <text x="529" y="193" text-anchor="middle" font-size="11" font-weight="600" fill="#1E40AF">TaskCompleted</text>

  <!-- ===== Arrow 4: bus → scheduler (TaskCompleted, lower) ===== -->
  <line x1="349" y1="175" x2="232" y2="175" stroke="#1E40AF" stroke-width="2" marker-end="url(#arrow-solid)"/>
  <text x="290" y="193" text-anchor="middle" font-size="11" font-weight="600" fill="#1E40AF">TaskCompleted</text>

  <!-- ===== Arrow 5: telemetry → bus (StatusChange, dashed) ===== -->
  <line x1="410" y1="348" x2="410" y2="217" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-dashed)"/>
  <text x="448" y="285" font-size="11" font-weight="600" fill="#6B7280">StatusChange</text>
  <text x="448" y="300" font-size="10" fill="#9CA3AF">(optional)</text>

  <!-- ===== Arrow 6: bus → scheduler (StatusChange, dashed, curved) ===== -->
  <path d="M 370 205 Q 300 280, 230 230 Q 180 215, 155 205" fill="none" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-dashed)"/>
  <text x="245" y="275" font-size="11" font-weight="600" fill="#6B7280">StatusChange</text>
  <text x="245" y="290" font-size="10" fill="#9CA3AF">(optional)</text>

  <!-- Legend -->
  <g transform="translate(580, 340)">
    <rect x="0" y="0" width="210" height="70" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <line x1="14" y1="20" x2="44" y2="20" stroke="#1E40AF" stroke-width="2" marker-end="url(#arrow-solid)"/>
    <text x="52" y="24" font-size="11" fill="#334155">core event flow</text>
    <line x1="14" y1="45" x2="44" y2="45" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-dashed)"/>
    <text x="52" y="49" font-size="11" fill="#334155">optional event flow</text>
  </g>
</svg>
