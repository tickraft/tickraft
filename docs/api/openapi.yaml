  /api/v1/expr/validate:
    post:
      tags: [expr]
      summary: Validate an expr-lang expression
      description: |
        Stateless validation endpoint used by the rule editors for
        real-time feedback. Compiles the expression against the selected
        environment's variable contract and runs it once against the
        environment's example payload, catching syntax errors, unknown
        variables, and domain-field violations. `env` must be one of
        alert, remediation, execution; remediation and execution accept
        an empty expression (no filter).
      operationId: validateExpression
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExprValidateRequest'
      responses:
        '200':
          description: Expression is valid
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ExprValidateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

