# Version: V2.1 | Updated: 2026-06-29 | Status: active
#
# Tickraft open-source repository OpenAPI specification
# - Includes only routes actually registered in the open-source repository
#   (pkg/api/handler/routes.go + pkg/collector/http/listener.go)
# - Excludes extension-repository routes (/admin/*, /channels/*, etc.)
# - Path prefix is uniformly /api/v1/ (healthz is a cluster-level probe and
#   retains the root path)
openapi: 3.0.3
info:
  title: Tickraft Open API
  version: 2.0.0
  description: |
    Tickraft open-source edition REST API specification.

    ## Base Information
    - Base path: `/api/v1`
    - Default ports: API server `6153`, Telemetry report endpoint `6253`
    - Unified response format: `{ "code": int, "msg": string, "data": object }`
    - Paginated response `data` structure: `{ "items": array, "total": int, "page": int, "size": int }`

    ## Authentication Schemes
    - **JWT Bearer**: default authentication for business endpoints, transmitted via `Authorization: Bearer {access_token}`
    - **HMAC Signature**: enabled for the Telemetry report endpoints when a secret is configured; the HMAC-SHA256 hex digest of the request body is sent via the `X-Tickraft-Signature` header
    - **Asset Key**: enabled for the Telemetry report endpoints when no secret is configured; the asset key is sent via the `X-Tickraft-Asset-Key` header
    - **API Key**: transmitted via the `X-API-Key` header, used for server-to-server calls (reserved in the open-source edition)

    ## Common Request Headers
    - `X-Tickraft-Request-Id`: request tracing identifier; clients are encouraged to generate and send it, and the server will pass it through or auto-generate one

servers:
  - url: http://localhost:6153
    description: Local development environment (API server)
  - url: http://localhost:6253
    description: Local development environment (Telemetry report endpoint)

tags:
  - name: auth
    description: "Auth module: login, logout, token refresh, password change, and API key management"
  - name: task
    description: "Task module: manage scheduled tasks and execution records"
  - name: scheduler
    description: "Scheduler module: task scheduling and execution statistics"
  - name: asset
    description: "Asset module: manage monitored assets"
  - name: telemetry
    description: "Telemetry module: collection tasks and state reports"
  - name: alert
    description: "Alert center module: manage alert rules and alert records"
  - name: system
    description: "System settings module: manage global configuration and runtime information"
  - name: meta
    description: "Metadata endpoint: cluster health probe"

paths:
  # ---------------------------------------------------------------------------
  # Meta - Cluster health probe
  # ---------------------------------------------------------------------------
  /healthz:
    get:
      tags: [meta]
      summary: Cluster health probe
      description: |
        Cluster-level health check endpoint, independent of the business
        authentication system.
        The current implementation always returns `{"status":"ok"}`; future
        versions will integrate DB/MQ/Cache dependency checks and return 503
        with a failure list when dependencies are unhealthy.
      operationId: healthz
      security: []
      responses:
        '200':
          description: Service healthy
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          status:
                            type: string
                            example: ok
        '503':
          $ref: '#/components/responses/InternalServerError'

  # ---------------------------------------------------------------------------
  # Auth - Authentication and authorization
  # ---------------------------------------------------------------------------
  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: User login
      description: Exchange username and password for an access token and refresh token.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/refresh:
    post:
      tags: [auth]
      summary: Refresh access token
      description: Exchange a refresh token for a new access token and refresh token.
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Refresh successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: User logout
      description: |
        Adds the current access token to a blacklist so it is invalidated
        immediately.
        The refresh token remains valid until it naturally expires or is
        explicitly revoked.
      operationId: logout
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/password:
    put:
      tags: [auth]
      summary: Change current user password
      operationId: changePassword
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password change successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/apikeys:
    get:
      tags: [auth]
      summary: List API keys
      description: Return metadata for all API keys under the current user/tenant (without the raw key).
      operationId: listAPIKeys
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List query successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/APIKey'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [auth]
      summary: Create API key
      description: |
        Generate a new API key. The raw key (raw_key) is returned only in this
        response; subsequent queries return only metadata such as the key
        prefix (key_prefix).
      operationId: createAPIKey
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAPIKeyRequest'
      responses:
        '200':
          description: Creation successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/APIKey'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/apikeys/{id}:
    delete:
      tags: [auth]
      summary: Revoke API key
      operationId: revokeAPIKey
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Revocation successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------------------
  # Task - Task module (scheduled tasks and execution records)
  # ---------------------------------------------------------------------------
  /api/v1/tasks:
    get:
      tags: [task]
      summary: Paginated list of tasks
      operationId: listTasks
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
        - name: group
          in: query
          required: false
          description: Exact group match
          schema:
            type: string
        - name: tags
          in: query
          required: false
          description: Comma-separated tag list; tasks matching any tag are returned
          schema:
            type: string
      responses:
        '200':
          description: Query successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PageData'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [task]
      summary: Create scheduled task
      operationId: createTask
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreateRequest'
      responses:
        '200':
          description: Creation successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/tasks/{id}:
    get:
      tags: [task]
      summary: Query a single task detail
      operationId: getTask
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Query successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [task]
      summary: Update scheduled task
      operationId: updateTask
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreateRequest'
      responses:
        '200':
          description: Update successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [task]
      summary: Delete scheduled task
      operationId: deleteTask
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Deletion successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/tasks/{id}/trigger:
    post:
      tags: [task]
      summary: Trigger task execution immediately
      description: Trigger a single task execution immediately, bypassing the schedule.
      operationId: triggerTask
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Trigger successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/tasks/{id}/copy:
    post:
      tags: [task]
      summary: Copy a task
      description: |
        Creates a copy of an existing task with a new ID. All fields including
        Group, Tags, and Config are copied. The source task remains unchanged.
      operationId: copyTask
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCopyRequest'
      responses:
        '200':
          description: Copy successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/tasks/{id}/pause:
    post:
      tags: [task]
      summary: Pause a task
      description: |
        Removes the task from the scheduling wheel by clearing its enabled
        flag. The task configuration is preserved and can be resumed via
        POST /api/v1/tasks/{id}/resume.
      operationId: pauseTask
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Pause successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Task is already paused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/v1/tasks/{id}/resume:
    post:
      tags: [task]
      summary: Resume a paused task
      description: Re-adds the task to the scheduling wheel by setting its enabled flag.
      operationId: resumeTask
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Resume successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Task is not paused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/v1/tasks/{id}/executions:
    get:
      tags: [task]
      summary: Paginated list of a task's execution records
      description: |
        Returns a paginated list of execution records for the given task.
        Supported filters: status (success/failed/running/unknown),
        executor_type, and task_name (case-insensitive substring match).
        An id of 0 lists executions across all tasks.
      operationId: listExecutions
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
        - name: status
          in: query
          required: false
          description: Filter by execution status
          schema:
            type: string
            enum: [success, failed, running, unknown]
        - name: executor_type
          in: query
          required: false
          description: Filter by executor type
          schema:
            type: string
        - name: task_name
          in: query
          required: false
          description: Case-insensitive substring match on the task name
          schema:
            type: string
      responses:
        '200':
          description: Query successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PageData'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/tasks/{id}/executions/{execId}:
    get:
      tags: [task]
      summary: Query a single execution record
      description: Returns the execution record execId, which must belong to the given task.
      operationId: getExecution
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - name: execId
          in: path
          required: true
          description: Execution record ID
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Query successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ExecutionRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------------------
  # Scheduler - Execution statistics
  # ---------------------------------------------------------------------------
  /api/v1/tasks/stats:
    get:
      tags: [scheduler]
      summary: Get execution statistics
      description: |
        Returns aggregated execution statistics for tasks within an optional
        time range. Defaults to the last 24 hours when no range is specified.
      operationId: getExecutionStats
      security:
        - BearerAuth: []
      parameters:
        - name: from
          in: query
          required: false
          description: Start of the time range (inclusive), RFC3339 date-time format
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: End of the time range (inclusive), RFC3339 date-time format
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Query successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ExecutionStats'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ---------------------------------------------------------------------------
  # Asset - Asset module (monitored assets)
  # ---------------------------------------------------------------------------
  /api/v1/assets:
    get:
      tags: [asset]
      summary: Paginated list of assets
      description: |
        Returns the list of monitored assets (task/device/host/port/website/service types).
        The open-source edition registers full CRUD, matching routes.go:94-98.
      operationId: listAssets
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
      responses:
        '200':
          description: Query successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PageData'
                          - type: object
                            properties:
                              items:
                                type: array
                                items:
                                  $ref: '#/components/schemas/Asset'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [asset]
      summary: Create asset
      description: Create a new monitored asset.
      operationId: createAsset
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetCreateRequest'
      responses:
        '200':
          description: Creation successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Asset'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/assets/{id}:
    get:
      tags: [asset]
      summary: Query a single asset detail
      operationId: getAsset
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Query successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Asset'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [asset]
      summary: Update asset
      operationId: updateAsset
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetCreateRequest'
      responses:
        '200':
          description: Update successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Asset'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [asset]
      summary: Delete asset
      operationId: deleteAsset
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Deletion successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------------------
  # Telemetry - Telemetry module (collection tasks and state reports)
  # ---------------------------------------------------------------------------
  /api/v1/telemetry:
    get:
      tags: [telemetry]
      summary: Paginated list of collection tasks
      description: |
        Returns a paginated list of telemetry collection tasks.
        Each task defines a target asset and a collection schedule that
        drives periodic probing or passive receiving.
      operationId: listTelemetryTasks
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
      responses:
        '200':
          description: Query successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PageData'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [telemetry]
      summary: Create collection task
      description: Create a new telemetry collection task bound to a target asset.
      operationId: createTelemetryTask
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelemetryTaskCreateRequest'
      responses:
        '200':
          description: Creation successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TelemetryTask'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/telemetry/{id}:
    get:
      tags: [telemetry]
      summary: Query a single collection task detail
      operationId: getTelemetryTask
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Query successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TelemetryTask'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [telemetry]
      summary: Update collection task
      operationId: updateTelemetryTask
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelemetryTaskCreateRequest'
      responses:
        '200':
          description: Update successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TelemetryTask'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
