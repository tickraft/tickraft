  # ---------------------------------------------------------------------------
  # Telemetry - Telemetry module (collection tasks and state reports)
  # ---------------------------------------------------------------------------
  /api/v1/telemetry:
    post:
      tags: [telemetry]
      summary: Unified telemetry report endpoint
      description: |
        Receives telemetry through a single endpoint; the `kind` field
        discriminates the payload and selects the size limit (heartbeat 1 KiB /
        metrics 64 KiB / logs 1 MiB / task_status 16 KiB).

        The endpoint also accepts the Prometheus text exposition format:
        requests with Content-Type `text/plain; version=0.0.4` are parsed
        with the exposition text parser and ingested as a metrics-kind
        report. Labels fold into the metric key
        (`http_requests_total{code="200",method="get"}`); histograms and
        summaries expand into `_sum`/`_count`/`_bucket{le="..."}`/
        `{quantile="..."}` series. Asset identity arrives via the query
        string (asset_id, or asset_key + tenant_id) and the same
        signature authentication applies; the push is capped at 64 KiB
        and counts as one event against the daily quota.

        The `task_status` kind carries a single execution outcome
        (running/completed/failed/timeout) keyed by the required `task_ref`
        credential: a 32-hex run handle (delivered to the remote via the
        X-Tickraft-Task-Ref dispatch header or the {{task_ref}} template)
        binds the exact dispatch row in any status; a pure decimal task
        number falls back to the task's latest running execution and, on
        miss, inserts a trigger_type=external row carrying the reporter's
        original ref. Off-vocabulary statuses are rejected with 400 at the
        edge. Reports authenticate with the listener's existing auth (HMAC
        or asset key). Reports are validated and applied to sys_schedule_log
        by the in-process report consumer; missing-report executions are
        reaped as `timeout` by the scheduler sweep.

        Authentication: per-point or global HMAC (X-Tickraft-Signature header,
        hex HMAC-SHA256 of the raw body) or asset identity resolution
        (asset_id, or asset_key + tenant_id).
      operationId: reportTelemetry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind:
                  type: string
                  description: Telemetry data category
                  enum: [heartbeat, metrics, logs, task_status]
                asset_id:
                  type: integer
                  format: int64
                  description: Reporting asset id (takes precedence over asset_key)
                asset_key:
                  type: string
                  description: Reporting asset key (resolved together with tenant_id)
                tenant_id:
                  type: integer
                  format: int64
                  description: Tenant id used with asset_key lookup
                status:
                  type: string
                  description: |
                    Pre-judged status string; for task_status this is the
                    reported execution status (running/completed/failed/
                    timeout; off-vocabulary values are rejected with 400)
                task_ref:
                  type: string
                  description: Required for task_status; the report
                    credential. A 32-hex run handle binds the exact dispatch
                    row; a pure decimal task number falls back to the task's
                    latest running execution (external row inserted on miss)
                started_at:
                  type: string
                  format: date-time
                  description: Task execution start time (task_status)
                finished_at:
                  type: string
                  format: date-time
                  description: Task execution finish time (task_status)
                output:
                  type: string
                  description: Task execution output (task_status)
                error:
                  type: string
                  description: Task execution error message (task_status)
                reason:
                  type: string
                  description: Transition reason (task kinds)
                metrics:
                  type: object
                  additionalProperties:
                    type: number
                  description: Numeric metrics (metrics kind)
                log_content:
                  type: string
                  description: Log content (logs kind)
                log_level:
                  type: string
                  description: Log severity, defaults to INFO (logs kind)
      responses:
        '202':
          description: Report accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          description: Request body exceeds the per-kind size limit
        '429':
          description: Daily event quota exceeded

  /api/v1/telemetry/monitors:
    get:
      tags: [telemetry]
      summary: Paginated list of monitoring points
      description: |
        Returns a paginated list of telemetry monitoring points ordered by
