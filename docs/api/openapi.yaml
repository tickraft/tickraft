        - $ref: '#/components/parameters/SignatureHeader'
        - $ref: '#/components/parameters/AssetKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HeartbeatReport'
      responses:
        '202':
          description: Report accepted
        '400':
          description: Malformed request body or missing asset identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          description: Asset key missing/invalid or HMAC signature mismatch
