  /api/v1/system/certificates/reload:
    post:
      tags: [system]
      summary: Reload TLS certificates
      description: |
        Rebuilds the active TLS configuration from the configured certificate
        and key files and publishes it atomically. Returns the SHA-256
        fingerprint (lowercase hex) of the newly loaded leaf certificate for
        operational verification.

        Mounting condition: registered only when the API server has TLS enabled
        and a CertificateHandler is injected via WithCertificateHandler (see
        pkg/api/handler/routes.go and pkg/api/handler/certificates.go).
        Authentication is enforced by the JWT middleware of the system route
        group; specific role permissions are determined by the permission
        middleware configured at route registration time.

        On failure, returns a standard ApiResponse-wrapped error (certificate
        or key file unreadable, parsing failure, etc.; see the ErrTLS* and
        ErrACME* errors in pkg/api/tls.go for details).
      operationId: reloadCertificates
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Reload successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CertificateReloadResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

# ---------------------------------------------------------------------------
# Components
# ---------------------------------------------------------------------------
components:
  # -------------------------------------------------------------------------
  # Authentication schemes
  # -------------------------------------------------------------------------
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'JWT Bearer token, transmitted via Authorization: Bearer {access_token}.'
    APIKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API Key authentication. The raw key is sent in the `X-API-Key` header; the server compares its SHA-256 hash.
    AssetKeyAuth:
      type: apiKey
      in: header
      name: X-Tickraft-Asset-Key
      description: |
        Telemetry report asset key authentication.
        Enabled when the server has no HMAC secret configured; the key must be
        a valid asset key issued by the system.
    HMACSignature:
      type: apiKey
      in: header
      name: X-Tickraft-Signature
      description: |
        Telemetry report HMAC signature authentication.
        Enabled when the server has a secret configured; the value is the
        HMAC-SHA256 hex digest of the raw request body.

  # -------------------------------------------------------------------------
  # Common parameters
  # -------------------------------------------------------------------------
  parameters:
    IdPath:
      name: id
      in: path
      required: true
      description: Unique asset identifier (int64).
      schema:
        type: integer
        format: int64
        minimum: 1
    PageQuery:
      name: page
      in: query
      required: false
      description: Page number, starting from 1; defaults to 1.
      schema:
        type: integer
        minimum: 1
        default: 1
    SizeQuery:
      name: size
      in: query
      required: false
      description: Page size; defaults to 20. The server enforces an upper bound.
      schema:
        type: integer
        minimum: 1
        default: 20
    RequestIdHeader:
      name: X-Tickraft-Request-Id
      in: header
      required: false
      description: Request tracing identifier. Clients may send it for end-to-end tracing; the server auto-generates one when absent.
      schema:
        type: string
        pattern: '^[A-Za-z0-9\-_]{8,64}$'
    SignatureHeader:
      name: X-Tickraft-Signature
      in: header
      required: false
      description: |
        HMAC-SHA256 signature (lowercase hex). Required when the server has a
        secret configured; the input to the signature is the raw request body.
      schema:
        type: string
        pattern: '^[0-9a-f]{64}$'
    AssetKeyHeader:
      name: X-Tickraft-Asset-Key
      in: header
      required: false
      description: Asset key. Required when the server has no secret configured; used to resolve the reporting asset identity.
      schema:
        type: string

  # -------------------------------------------------------------------------
  # Common responses
  # -------------------------------------------------------------------------
  responses:
    BadRequest:
      description: Request parameter validation failed or malformed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
          example:
            code: 40000
            msg: invalid request parameter
            data: null
    Unauthorized:
      description: Not authenticated or token invalid/expired
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
          example:
            code: 40100
            msg: missing authorization header
            data: null
    Forbidden:
      description: Authenticated but lacks permission to access the asset
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
          example:
            code: 40300
            msg: permission denied
            data: null
    NotFound:
      description: Asset not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
          example:
            code: 40400
            msg: asset not found
            data: null
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
          example:
            code: 50000
            msg: internal error
            data: null

  # -------------------------------------------------------------------------
  # Data models
  # -------------------------------------------------------------------------
  schemas:
    ApiResponse:
      type: object
      description: Unified response wrapper structure
      properties:
        code:
          type: integer
          description: Business code; 0 indicates success, non-zero indicates an error (the first 3 digits usually align with the HTTP status code).
          example: 0
        msg:
          type: string
          description: Hint message; "ok" on success.
          example: ok
        data:
          description: Business data; null on error.
          nullable: true

    PageData:
      type: object
      description: Paginated data wrapper structure, returned as ApiResponse.data
      properties:
        items:
          type: array
          description: List of data items on the current page
          items: {}
        total:
          type: integer
          format: int64
          description: Total record count
          example: 100
        page:
          type: integer
          description: Current page number
          example: 1
        size:
          type: integer
          description: Page size
          example: 20

    # --- Auth schemas ---
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          description: Username
        password:
          type: string
          description: Password (transmitted in plaintext; recommended only for intranet or HTTPS environments)
          format: password

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          description: Refresh token

    ChangePasswordRequest:
      type: object
      required: [old_password, new_password]
      properties:
        old_password:
          type: string
          format: password
          description: Current password
        new_password:
          type: string
          format: password
          description: New password

    CreateAPIKeyRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: API key name, for identification purposes
        expired_at:
          type: string
          format: date-time
          description: Expiration time (RFC3339), optional; never expires if omitted
          nullable: true

    TokenPair:
      type: object
      description: Access token and refresh token pair
      properties:
        access_token:
          type: string
          description: Access token (JWT), short-lived
        refresh_token:
          type: string
          description: Refresh token, long-lived, used to obtain a new access token

    APIKey:
      type: object
      description: API key metadata
      properties:
        id:
          type: integer
          format: int64
          description: API key primary key
        name:
          type: string
          description: Name
        raw_key:
          type: string
          description: Raw key, returned only once at creation time
        key_prefix:
          type: string
          description: Key prefix, used for subsequent identification
        status:
          type: integer
          description: Status code (0 = normal, other values indicate revoked, etc.)
        created_at:
          type: string
          format: date-time
        expired_at:
          type: string
          format: date-time
          nullable: true

    # --- Task schemas ---
    Task:
      type: object
      description: Scheduled task
      properties:
        id:
          type: integer
          format: int64
          description: Task primary key
        name:
          type: string
          description: Task name
        description:
          type: string
          description: Task description
        executor_type:
          type: string
          description: |
            Executor type, which determines the structure of config and the
            execution pipeline.
            Built-in values in the open-source edition: `http`, `tcp`, `local`,
            `webhook`, `icmp`.
            Extension values in the pro repository: `dns`, `udp`
            (included by default in pro builds, no build tags required).
          enum: [http, tcp, local, webhook, icmp]
          example: http
        config:
          type: object
          description: |
            Executor parameters; structure varies by executor:
            - `http`: `{ "method": "GET", "url": "https://example.com", "headers": {...} }`
            - `tcp`: `{ "host": "127.0.0.1", "port": 3306 }`
            - `local`: `{ "interpreter": "bash", "source": "..." }`
            - `webhook`: `{ "url": "...", "method": "POST", "headers": {...} }`
            - `icmp`: `{ "host": "127.0.0.1", "count": 3 }`
          additionalProperties: true
          nullable: true
        schedule:
          type: string
          description: |
            Single source of truth for when the task runs: a cron expression,
            a Go duration string (e.g. `5m`, `30s`), or "" for event-driven
            tasks that are triggered externally instead of on a timer.
          example: "*/5 * * * *"
        enabled:
          type: boolean
          description: Whether the scheduler drives the task; pause/resume toggle this flag
        timeout:
          type: integer
          format: int64
          description: Task-level execution timeout in seconds (applied to every executor); defaults to 30 on create
          minimum: 1
          maximum: 86400
        max_retries:
          type: integer
          description: Number of retry attempts after a failed execution; 0 disables retries
          minimum: 0
          maximum: 10
        retry_interval:
          type: integer
          format: int64
          description: Delay between retry attempts in seconds
          minimum: 0
          maximum: 3600
        group:
          type: string
          description: Logical grouping key (e.g. `prober` for telemetry
            monitoring points); tasks in a group can be listed or acted on
            together
          nullable: true
        tags:
          type: array
          description: Free-form labels
          items:
            type: string
          nullable: true
        run_id:
          type: string
          description: Identifier of the last run when applicable
          nullable: true
        retry_policy:
          type: string
          description: Retry strategy (`fixed` or `exponential`)
          nullable: true
        concurrency:
          type: integer
          description: Per-task concurrent execution limit (0 means unlimited, 1 forbids concurrent executions)
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TaskCreateRequest:
      type: object
      required: [name, executor_type]
      properties:
        name:
          type: string
          description: Task name
        description:
          type: string
          description: Task description
        executor_type:
          type: string
          description: "Executor type (open-source edition: http/tcp/local/webhook/icmp)"
          enum: [http, tcp, local, webhook, icmp]
        config:
          type: object
          description: Executor parameters; structure determined by executor, see Task.config
          additionalProperties: true
          nullable: true
        schedule:
          type: string
          description: Cron expression, Go duration string (e.g. `5m`), or "" for event-driven tasks
        enabled:
          type: boolean
          description: Whether the scheduler drives the task; defaults to false
        timeout:
          type: integer
          format: int64
          description: Execution timeout in seconds; defaults to 30 when omitted or <= 0
          minimum: 1
          maximum: 86400
        max_retries:
          type: integer
          description: Number of retry attempts after a failed execution; 0 disables retries
          minimum: 0
          maximum: 10
        retry_interval:
          type: integer
          format: int64
          description: Delay between retry attempts in seconds
          minimum: 0
          maximum: 3600
        group:
          type: string
          description: Logical grouping key
          nullable: true
        tags:
          type: array
          description: Free-form labels
          items:
            type: string
          nullable: true
        retry_policy:
          type: string
          description: Retry strategy (`fixed` or `exponential`)
          nullable: true
        concurrency:
          type: integer
          description: Per-task concurrent execution limit (0 means unlimited, 1 forbids concurrent executions)

    TaskCopyRequest:
      type: object
      description: Optional request body for copying a task
      properties:
        name:
          type: string
          description: |
            Name for the copied task. If omitted, defaults to
            "<original_name> (copy)".

    ExecutionRecord:
      type: object
      description: Task execution record
      properties:
        id:
          type: integer
          format: int64
          description: Execution record primary key
        task_id:
          type: integer
          format: int64
          description: Associated task ID
        task_name:
          type: string
          description: Owning task's name, resolved from the task store at read time
          nullable: true
        executor_type:
          type: string
          description: Executor that produced this run
          nullable: true
        status:
          type: string
          description: Execution status
          enum: [success, failed, running, unknown]
        output:
          type: string
          description: Execution output
        error:
          type: string
          description: Execution error message (populated on failure)
          nullable: true
        status_code:
          type: integer
          description: Transport-level status code when applicable
        duration:
          type: integer
          format: int64
          description: Execution duration in milliseconds
        retry_count:
          type: integer
          description: Number of retry attempts consumed
        started_at:
          type: string
          format: date-time
          description: Start time
        finished_at:
          type: string
          format: date-time
          description: End time (null if not yet finished)
          nullable: true

    # --- Asset schemas ---
    Asset:
      type: object
      description: Collector asset (monitored target)
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          description: Asset name
        type:
          type: string
          description: |
            Asset type, aligned with the constants defined in
            pkg/asset/asset.go:13-23:
            - task: scheduled task
            - device: generic device
            - host: host
            - port: port
            - website: website
            - service: service
          enum: [task, device, host, port, website, service]
        target:
          type: string
          description: Probe target address
          example: "https://example.com"
        enabled:
          type: boolean
          description: Whether enabled
        config:
          type: object
          description: Asset-specific configuration (timeout, retries, port, etc.)
          additionalProperties: true
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AssetCreateRequest:
      type: object
      required: [name, type, target]
      properties:
        name:
          type: string
          description: Asset name
        type:
          type: string
          description: Asset type
          enum: [task, device, host, port, website, service]
        target:
          type: string
          description: Probe target address
        enabled:
          type: boolean
          description: Whether enabled; defaults to false
        config:
          type: object
          description: Asset-specific configuration
          additionalProperties: true
          nullable: true

    # --- Telemetry task schemas ---
    TelemetryTask:
      type: object
      description: Telemetry monitoring point. The wire shape and the
        storage shape are the same model; runtime-managed columns
        (status, interval, timeout) never appear on the wire.
      properties:
        id:
          type: integer
          format: int64
          description: Monitoring point primary key
        name:
          type: string
          description: Display name
        description:
          type: string
          description: Task description
          nullable: true
        asset_type:
          type: string
          description: Category of the monitored asset (e.g. host, service)
          nullable: true
        asset_id:
          type: integer
          format: int64
          description: Optional link to an asset row; metric history and
            logs are surfaced via the history/logs endpoints when set
          nullable: true
        mode:
          type: string
          description: |
            Collection mode:
            - `active`: probes the target on a schedule
            - `passive`: receives data pushed by the target via the report endpoint
          enum: [active, passive]
          example: active
        type:
          type: string
          description: |
            Prober executor type for `active` mode (icmp, tcp, http, udp)
            or listener type for `passive` mode (webhook).
          example: http
        schedule:
          type: string
          description: Probe schedule — a Go duration string (e.g. `60s`)
            or a cron expression. Empty falls back to the runtime default
            interval.
          example: "60s"
          nullable: true
        enabled:
          type: boolean
          description: Whether enabled
        config:
          type: object
          description: |
            Type-specific configuration, persisted as JSON. For an ICMP
            prober it carries the target address; for a webhook listener
            the path and auth settings.
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TelemetryTaskCreateRequest:
      type: object
      required: [name, mode, type]
      properties:
        name:
          type: string
          description: Task name
        description:
          type: string
          description: Task description
          nullable: true
        asset_type:
          type: string
          nullable: true
        asset_id:
          type: integer
          format: int64
          nullable: true
        mode:
          type: string
          description: Collection mode (`active` for active probing, `passive` for passive receiving)
          enum: [active, passive]
        type:
          type: string
          description: Prober executor type (active mode) or listener type (passive mode)
          example: icmp
        schedule:
          type: string
          description: Go duration string or cron expression
          nullable: true
        enabled:
          type: boolean
          description: Whether enabled; defaults to true
        config:
          type: object
          nullable: true

    # --- Telemetry report schemas ---
    HeartbeatReport:
      type: object
      description: |
        Asset heartbeat report body.
        Maximum payload size is 1 KiB; the server returns 413 when exceeded.
      properties:
        asset_id:
          type: integer
          format: int64
          description: Asset ID; takes precedence over asset_key for resolution when present.
          nullable: true
        asset_key:
          type: string
          description: Asset key; must be used together with tenant_id.
          nullable: true
        tenant_id:
          type: integer
          format: int64
          description: Tenant ID; used together with asset_key to look up the asset.
          nullable: true
        status:
          type: string
          description: Pre-judged liveness status (e.g. `ok`, `down`, `unknown`)
          example: ok
        timestamp:
          type: string
          format: date-time
          description: Reporting time (RFC3339)
        message:
          type: string
          description: Short message (optional)
          nullable: true

    MetricsReport:
      type: object
      description: |
        Asset metrics report body.
        Maximum payload size is 64 KiB; the server returns 413 when exceeded.
      properties:
        asset_id:
          type: integer
          format: int64
          description: Asset ID; takes precedence over asset_key for resolution when present.
          nullable: true
        asset_key:
          type: string
          description: Asset key; must be used together with tenant_id.
          nullable: true
        tenant_id:
          type: integer
          format: int64
          description: Tenant ID; used together with asset_key to look up the asset.
          nullable: true
        metrics:
          type: object
          description: Numeric metric key-value pairs
          additionalProperties:
            type: number
            format: double
        timestamp:
          type: string
          format: date-time
          description: Reporting time (RFC3339)

    LogsReport:
      type: object
      description: |
        Asset logs report body.
        Maximum payload size is 1 MiB; the server returns 413 when exceeded.
      properties:
        asset_id:
          type: integer
          format: int64
          description: Asset ID; takes precedence over asset_key for resolution when present.
          nullable: true
        asset_key:
          type: string
          description: Asset key; must be used together with tenant_id.
          nullable: true
        tenant_id:
          type: integer
          format: int64
          description: Tenant ID; used together with asset_key to look up the asset.
          nullable: true
        level:
          type: string
          description: Log level; defaults to INFO
          enum: [DEBUG, INFO, WARN, ERROR]
          nullable: true
        content:
          type: string
          description: Log content
        timestamp:
          type: string
          format: date-time
          description: Reporting time (RFC3339)

    # --- Alert schemas ---
    AlertRule:
      type: object
      description: Alert rule. The wire shape and the storage shape are the
        same model; internal columns (tenant_id, deleted_at) never appear
        on the wire.
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          description: Rule name
        description:
          type: string
          description: Rule description (optional)
        expression:
          type: string
          description: expr-lang source text compiled by the rule engine
          example: metrics["cpu"] > 90
        priority:
          type: integer
          description: Rule ordering; higher values fire first
          default: 0
        group_id:
          type: integer
          format: int64
          description: Resource group visibility; null means tenant-wide
          nullable: true
        metadata:
          type: object
          description: Extension key-value pairs (string to string)
          additionalProperties:
            type: string
          nullable: true
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AlertRuleCreateRequest:
      type: object
      required: [name, expression]
      properties:
        name:
          type: string
        description:
          type: string
        expression:
          type: string
          description: expr-lang source text
        priority:
          type: integer
        group_id:
          type: integer
          format: int64
          nullable: true
        metadata:
          type: object
          additionalProperties:
            type: string
          nullable: true
        enabled:
          type: boolean

    AlertRecord:
      type: object
      description: Alert history record
      properties:
        id:
          type: integer
          format: int64
        rule_id:
          type: integer
          format: int64
          description: ID of the rule that triggered this record
        rule_name:
          type: string
          description: Rule name snapshot
        severity:
          type: string
          description: Severity level (from the rule snapshot)
          enum: [info, warning, critical]
        value:
          type: number
          format: double
          description: Actual metric value at trigger time
        status:
          type: string
          description: Alert status
          enum: [firing, acknowledged, resolved]
        message:
          type: string
          description: Alert message
        triggered_at:
          type: string
          format: date-time
          description: Trigger time
        acknowledged_at:
          type: string
          format: date-time
          description: Acknowledgement time; null if not acknowledged
          nullable: true
        resolved_at:
          type: string
          format: date-time
          description: Resolution time; null if not resolved
          nullable: true

    # --- System schemas ---
    SystemConfig:
      type: object
      description: System configuration
      properties:
        logLevel:
          type: string
          description: Log level
          enum: [debug, info, warn, error]
        defaultLang:
          type: string
          description: Default language code
          example: zh-Hans
        retentionDays:
          type: integer
          description: Data retention days
          example: 30

    SystemInfo:
      type: object
      description: Runtime system information
      properties:
        version:
          type: string
          description: System version number
        buildTags:
          type: string
          description: Build tags
        startTime:
          type: string
          format: date-time
          description: Process start time
        uptime:
          type: string
          description: Uptime (human-readable)

    CertificateReloadResponse:
      type: object
      description: Certificate reload response
      properties:
        fingerprint:
          type: string
          description: SHA-256 fingerprint of the newly loaded leaf certificate (lowercase hex, 64 characters)
          example: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08

    ExecutionStats:
      type: object
      description: Aggregated task execution statistics within a time range
      properties:
        total_executions:
          type: integer
          description: Total executions in the time range
        success_count:
          type: integer
          description: Executions with normal/success status
        failure_count:
          type: integer
          description: Executions with abnormal/failure status
        success_rate:
          type: number
          format: double
          description: Success rate as percentage (0-100)
        average_duration_ms:
          type: number
          format: double
          description: Average execution duration in milliseconds

    GlobalStats:
      type: object
      description: Global system statistics
      properties:
        total_tasks:
          type: integer
          description: Total number of tasks
        total_devices:
          type: integer
          description: Total number of device-type assets
        today_executions:
          type: integer
          description: Number of executions in the current day
        today_success_rate:
          type: number
          format: double
          description: Today's success rate as percentage (0-100)

