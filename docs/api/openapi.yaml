  /api/v1/prism/alert/records/export:
    get:
      tags: [alert]
      summary: Export alert records as CSV
      description: |
        Streams the records matching the same filters as the list endpoint
        (severity/status/from/to) as a CSV download, ordered by descending
        id like the list. Rows stream page by page (chunked transfer) and
        the export is capped at 100,000 rows; store failures after the
        headers are sent surface as a truncated download.
      operationId: exportAlertRecords
      security:
        - BearerAuth: []
      parameters:
        - name: severity
          in: query
          required: false
          schema:
            type: string
          description: Filter by severity.
        - name: status
          in: query
          required: false
          schema:
            type: string
          description: Filter by record status.
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Filter records triggered at or after this RFC3339 timestamp.
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Filter records triggered before this RFC3339 timestamp.
      responses:
        '200':
          description: CSV file download (attachment, alert_records.csv)
          content:
            text/csv:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

