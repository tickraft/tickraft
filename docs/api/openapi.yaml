        (AssetKey scheme) when the server has no HMAC secret configured, or
        via the `X-Tickraft-Signature` header (HMAC-SHA256 hex digest of the
        raw request body) when a secret is configured.

        Maximum request body size is 1 KiB; exceeding it returns 413.
        Asset identity is resolved from the asset key supplied in the
        header (or from `asset_id`/`asset_key` + `tenant_id` in the body
        when present).
      operationId: reportHeartbeat
      security:
        - AssetKeyAuth: []
        - HMACSignature: []
