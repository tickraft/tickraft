  /api/v1/system/info:
    get:
      tags: [system]
      summary: Query runtime system information
      description: |
        Returns runtime information such as system version, build tags, start
        time, and uptime.
        The open-source edition returns only basic system information; the
        extended edition can inject additional fields via the SystemService SPI.
      operationId: getSystemInfo
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Query successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SystemInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/system/stats:
    get:
      tags: [system]
      summary: Get global system statistics
      description: |
        Returns global statistics aggregated across the entire system, including
        total tasks, total devices, today's executions, and today's success rate.
      operationId: getGlobalStats
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Query successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/GlobalStats'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/system/certificates/reload:
    post:
      tags: [system]
      summary: Reload TLS certificates
      description: |
        Rebuilds the active TLS configuration from the configured certificate
        and key files and publishes it atomically. Returns the SHA-256
        fingerprint (lowercase hex) of the newly loaded leaf certificate for
        operational verification.

        Mounting condition: registered only when the API server has TLS enabled
        and a CertificateHandler is injected via WithCertificateHandler (see
        pkg/api/handler/routes.go and pkg/api/handler/certificates.go).
        Authentication is enforced by the JWT middleware of the system route
        group; specific role permissions are determined by the permission
        middleware configured at route registration time.

        On failure, returns a standard ApiResponse-wrapped error (certificate
        or key file unreadable, parsing failure, etc.; see the ErrTLS* and
        ErrACME* errors in pkg/api/tls.go for details).
      operationId: reloadCertificates
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Reload successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CertificateReloadResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/system/profile:
    get:
      tags: [system]
      summary: Query the current user's profile
      description: |
        Returns the profile of the authenticated user (the JWT subject):
        username, nickname, email, role, language, and alert format style.
      operationId: getProfile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Query successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [system]
      summary: Update the current user's profile
      description: |
        Partial update: only the fields present in the request body are
        applied; nil fields are ignored. Returns the updated profile.
      operationId: updateProfile
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Update successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/status:
    get:
      tags: [status]
      summary: Public status page view
      description: |
        Intentionally public endpoint (no authentication): returns the
        aggregated status view rendered from the status configuration,
        monitor points, probe records, and the task engine health. The
        view is cached for 30 seconds. When the page is disabled (the
        default) or the service is not configured, the endpoint returns
        404 — indistinguishable from a missing route.
      operationId: getPublicStatus
      security: []
      responses:
        '200':
          description: Rendered status page view
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          title:
                            type: string
                          description:
                            type: string
                          overall:
                            type: string
                            enum: [operational, degraded, partial_outage, major_outage, unknown]
                          components:
                            type: array
                            items:
                              type: object
                              properties:
                                name:
                                  type: string
                                description:
                                  type: string
                                status:
                                  type: string
                                  enum: [operational, degraded, partial_outage, major_outage, unknown]
                                monitor_count:
                                  type: integer
                                last_checked:
                                  type: string
                                  format: date-time
                          updated_at:
                            type: string
                            format: date-time
        '404':
          description: Status page disabled or status service not configured
  /api/v1/status/config:
    get:
      tags: [status]
      summary: Get status page configuration
      description: |
        Returns the sys_status_config singleton: title, description,
        enabled flag, and the component mapping onto monitor points.
        Requires JWT authentication with the wildcard permission.
      operationId: getStatusConfig
      security: [{BearerAuth: []}]
      responses:
        '200':
          description: Current status page configuration
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          title:
                            type: string
                          description:
                            type: string
                          enabled:
                            type: boolean
                          components:
                            type: array
                            items:
                              type: object
                              properties:
                                name:
                                  type: string
                                description:
                                  type: string
                                point_ids:
                                  type: array
                                  items:
                                    type: integer
                                    format: int64
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [status]
      summary: Update status page configuration
      description: |
        Replaces the status page configuration. Validation: title is
        required (max 255 chars), description max 1024 chars, component
        names required and unique. The page stays private until enabled
        is set to true.
      operationId: updateStatusConfig
      security: [{BearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                  maxLength: 255
                description:
                  type: string
                  maxLength: 1024
                enabled:
                  type: boolean
                components:
                  type: array
                  items:
                    type: object
                    required: [name]
                    properties:
                      name:
                        type: string
                      description:
                        type: string
                      point_ids:
                        type: array
                        items:
                          type: integer
                          format: int64
      responses:
        '200':
          description: Updated configuration
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/i18n/locales:
    get:
      tags: [i18n]
      summary: List available locales
      description: |
        Public endpoint returning the registered locale bundles (BCP 47
        tag, language, region, text direction, native name). The kernel
        ships zh-Hans (default) and en-US; downstream locale packs extend
        the list via the i18n registry.
      operationId: listLocales
      security: []
      responses:
        '200':
          description: Query successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/LocaleInfo'

  /ws:
    get:
      tags: [realtime]
      summary: WebSocket realtime push
      description: |
        Upgrades to a WebSocket connection for realtime event push
        (execution status, alert lifecycle). Browsers cannot set the
        Authorization header on a WebSocket handshake, so authentication
        uses the access token passed via the `token` query parameter and
        is enforced before the upgrade.
      operationId: websocketPush
      security: []
      parameters:
        - name: token
          in: query
          required: true
          description: JWT access token (browsers cannot set the Authorization header on a WebSocket handshake)
          schema:
            type: string
      responses:
        '101':
          description: Switching protocols (WebSocket upgrade accepted)
        '401':
          $ref: '#/components/responses/Unauthorized'

# ---------------------------------------------------------------------------
# Components
# ---------------------------------------------------------------------------
components:
  # -------------------------------------------------------------------------
  # Authentication schemes
  # -------------------------------------------------------------------------
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'JWT Bearer token, transmitted via Authorization: Bearer {access_token}.'
    APIKeyAuth:
      type: apiKey
      in: header
      name: X-Tickraft-API-Key
      description: API Key authentication. The raw key is sent in the `X-Tickraft-API-Key` header; the server compares its SHA-256 hash.
    AssetKeyAuth:
      type: apiKey
      in: header
      name: X-Tickraft-Asset-Key
      description: |
        Telemetry report asset key authentication.
        Enabled when the server has no HMAC secret configured; the key must be
        a valid asset key issued by the system.
    HMACSignature:
      type: apiKey
      in: header
      name: X-Tickraft-Signature
      description: |
        Telemetry report HMAC signature authentication.
        Enabled when the server has a secret configured; the value is the
        HMAC-SHA256 hex digest of the raw request body.

  # -------------------------------------------------------------------------
  # Common parameters
  # -------------------------------------------------------------------------
  parameters:
    IdPath:
      name: id
      in: path
      required: true
      description: Unique asset identifier (int64).
      schema:
        type: integer
        format: int64
        minimum: 1
    PageQuery:
      name: page
      in: query
      required: false
      description: Page number, starting from 1; defaults to 1.
      schema:
        type: integer
        minimum: 1
        default: 1
    SizeQuery:
      name: size
      in: query
      required: false
      description: Page size; defaults to 20. The server enforces an upper bound.
      schema:
        type: integer
        minimum: 1
        default: 20
    RequestIdHeader:
      name: X-Tickraft-Request-Id
      in: header
      required: false
      description: Request tracing identifier. Clients may send it for end-to-end tracing; the server auto-generates one when absent.
      schema:
        type: string
        pattern: '^[A-Za-z0-9\-_]{8,64}$'
    SignatureHeader:
      name: X-Tickraft-Signature
      in: header
      required: false
      description: |
        HMAC-SHA256 signature (lowercase hex). Required when the server has a
        secret configured; the input to the signature is the raw request body.
      schema:
        type: string
        pattern: '^[0-9a-f]{64}$'
    AssetKeyHeader:
      name: X-Tickraft-Asset-Key
      in: header
      required: false
      description: Asset key. Required when the server has no secret configured; used to resolve the reporting asset identity.
      schema:
        type: string

  # -------------------------------------------------------------------------
  # Common responses
  # -------------------------------------------------------------------------
  responses:
    BadRequest:
      description: Request parameter validation failed or malformed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
          example:
            code: 40000
            message: invalid request parameter
            data: null
    Unauthorized:
      description: Not authenticated or token invalid/expired
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
          example:
            code: 40100
            message: missing authorization header
            data: null
    Forbidden:
      description: Authenticated but lacks permission to access the asset
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
          example:
            code: 40300
            message: permission denied
            data: null
    NotFound:
      description: Asset not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
          example:
            code: 40400
            message: asset not found
            data: null
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
          example:
            code: 50000
            message: internal error
            data: null

  # -------------------------------------------------------------------------
  # Data models
  # -------------------------------------------------------------------------
  schemas:
    ApiResponse:
      type: object
      description: Unified response wrapper structure
      properties:
        code:
          type: integer
          description: Business code; 0 indicates success, non-zero indicates an error (the first 3 digits usually align with the HTTP status code).
          example: 0
        message:
          type: string
          description: Hint message; "ok" on success.
          example: ok
        data:
          description: Business data; null on error.
          nullable: true

    PageData:
      type: object
      description: Paginated data wrapper structure, returned as ApiResponse.data
      properties:
        items:
          type: array
          description: List of data items on the current page
          items: {}
        total:
          type: integer
          format: int64
          description: Total record count
          example: 100
        page:
          type: integer
          description: Current page number
          example: 1
        size:
          type: integer
          description: Page size
          example: 20

    # --- Auth schemas ---
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          description: Username
        password:
          type: string
          description: Password (transmitted in plaintext; recommended only for intranet or HTTPS environments)
          format: password

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          description: Refresh token

    ChangePasswordRequest:
      type: object
      required: [old_password, new_password]
      properties:
        old_password:
          type: string
          format: password
          description: Current password
        new_password:
          type: string
          format: password
          description: New password

    CreateAPIKeyRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: API key name, for identification purposes
        expired_at:
          type: string
          format: date-time
          description: Expiration time (RFC3339), optional; never expires if omitted
          nullable: true

    TokenPair:
      type: object
      description: Access token and refresh token pair
      properties:
        access_token:
          type: string
          description: Access token (JWT), short-lived
        refresh_token:
          type: string
          description: Refresh token, long-lived, used to obtain a new access token

    APIKey:
      type: object
      description: API key metadata
      properties:
        id:
          type: integer
          format: int64
          description: API key primary key
        name:
          type: string
          description: Name
        raw_key:
          type: string
          description: Raw key, returned only once at creation time
        key_prefix:
          type: string
          description: Key prefix, used for subsequent identification
        status:
          type: integer
          description: Status code (0 = normal, other values indicate revoked, etc.)
        created_at:
          type: string
          format: date-time
        expired_at:
          type: string
          format: date-time
          nullable: true

    # --- Task schemas ---
    Task:
      type: object
      description: Scheduled task
      properties:
        id:
          type: integer
          format: int64
          description: Task primary key
        name:
          type: string
          description: Task name
        description:
          type: string
          description: Task description
        executor_type:
          type: string
          description: |
            Executor type, which determines the structure of config and the
            execution pipeline.
            Built-in values in the open-source edition: `http`, `tcp`, `local`,
            `webhook`, `icmp`.
            Extension values in the pro repository: `dns`, `udp`
            (included by default in pro builds, no build tags required).
          enum: [http, tcp, local, webhook, icmp]
          example: http
        config:
          type: object
          description: |
            Executor parameters; structure varies by executor:
            - `http`: `{ "method": "GET", "url": "https://example.com", "headers": {...} }`
            - `tcp`: `{ "host": "127.0.0.1", "port": 3306 }`
            - `local`: `{ "interpreter": "bash", "source": "..." }`
            - `webhook`: `{ "url": "...", "method": "POST", "headers": {...} }`
            - `icmp`: `{ "host": "127.0.0.1", "count": 3 }`
          additionalProperties: true
          nullable: true
        schedule:
          type: string
          description: |
            Single source of truth for when the task runs: a cron expression,
            a Go duration string (e.g. `5m`, `30s`), or "" for event-driven
            tasks that are triggered externally instead of on a timer.
          example: "*/5 * * * *"
        enabled:
          type: boolean
          description: Whether the scheduler drives the task; pause/resume toggle this flag
        timeout:
          type: integer
          format: int64
          description: Task-level execution timeout in seconds (applied to every executor); defaults to 30 on create
          minimum: 1
          maximum: 86400
        max_retries:
          type: integer
          description: Number of retry attempts after a failed execution; 0 disables retries
          minimum: 0
          maximum: 10
        retry_interval:
          type: integer
          format: int64
          description: Delay between retry attempts in seconds
          minimum: 0
          maximum: 3600
        group:
          type: string
          description: Logical grouping key (e.g. `prober` for telemetry
            monitoring points); tasks in a group can be listed or acted on
            together
          nullable: true
        tags:
          type: array
          description: Free-form labels
          items:
            type: string
          nullable: true
        run_id:
          type: string
          description: Run handle of the last dispatched run; doubles as the
            task_ref report credential delivered to the remote in Mode A
          nullable: true
        retry_policy:
          type: string
          description: Retry strategy (`fixed` or `exponential`)
          nullable: true
        concurrency:
          type: integer
          description: Per-task concurrent execution limit (0 means unlimited, 1 forbids concurrent executions)
        report_status:
          type: boolean
          description: |
            Enable remote task-status reporting. When true, the scheduler only
            records the dispatch lifecycle: each fire inserts a `running`
            execution row and the real execution outcome is reported back
            through POST /api/v1/telemetry (kind=task_status) keyed by the
            required task_ref credential (32-hex run handle or decimal task
            number). The remote reporter authenticates with the listener's
            existing auth (HMAC or asset key); webhook/http executors deliver
            the run handle to the remote via the X-Tickraft-Task-Ref dispatch
            header. The executor config may embed a {{task_ref}} placeholder
            that is substituted at dispatch time so any executor type can
            carry the report credential to the remote side. When false
            (default), the execution status is derived directly from the
            local executor result.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TaskCreateRequest:
      type: object
      required: [name, executor_type]
      properties:
        name:
          type: string
          description: Task name
        description:
          type: string
          description: Task description
        executor_type:
          type: string
          description: "Executor type (open-source edition: http/tcp/local/webhook/icmp)"
          enum: [http, tcp, local, webhook, icmp]
        config:
          type: object
          description: Executor parameters; structure determined by executor, see Task.config
          additionalProperties: true
          nullable: true
        schedule:
          type: string
          description: Cron expression, Go duration string (e.g. `5m`), or "" for event-driven tasks
        enabled:
          type: boolean
          description: Whether the scheduler drives the task; defaults to false
        timeout:
          type: integer
          format: int64
          description: Execution timeout in seconds; defaults to 30 when omitted or <= 0
          minimum: 1
          maximum: 86400
        max_retries:
          type: integer
          description: Number of retry attempts after a failed execution; 0 disables retries
          minimum: 0
          maximum: 10
        retry_interval:
          type: integer
          format: int64
          description: Delay between retry attempts in seconds
          minimum: 0
          maximum: 3600
        group:
          type: string
          description: Logical grouping key
          nullable: true
        tags:
          type: array
          description: Free-form labels
          items:
            type: string
          nullable: true
        retry_policy:
          type: string
          description: Retry strategy (`fixed` or `exponential`)
          nullable: true
        concurrency:
          type: integer
          description: Per-task concurrent execution limit (0 means unlimited, 1 forbids concurrent executions)
        report_status:
          type: boolean
          description: Enable remote task-status reporting (see
            Task.report_status). Supported for every executor type.

    TaskCopyRequest:
      type: object
      description: Optional request body for copying a task
      properties:
        name:
          type: string
          description: |
            Name for the copied task. If omitted, defaults to
            "<original_name> (copy)".

    ExecutionRecord:
      type: object
      description: Task execution record
      properties:
        id:
          type: integer
          format: int64
          description: Execution record primary key
        task_id:
          type: integer
          format: int64
          description: Associated task ID
        task_name:
          type: string
          description: Owning task's name, resolved from the task store at read time
          nullable: true
        executor_type:
          type: string
          description: Executor that produced this run
          nullable: true
        status:
          type: string
          description: Execution status
          enum: [success, failed, timeout, running, unknown]
        output:
          type: string
          description: Execution output
        error:
          type: string
          description: Execution error message (populated on failure)
          nullable: true
        status_code:
          type: integer
          description: Transport-level status code when applicable
        duration:
          type: integer
          format: int64
          description: Execution duration in milliseconds
        retry_count:
          type: integer
          description: Number of retry attempts consumed
        started_at:
          type: string
          format: date-time
          description: Start time
        finished_at:
          type: string
          format: date-time
          description: End time (null if not yet finished)
          nullable: true

    # --- Asset schemas ---
    Asset:
      type: object
      description: Telemetry asset (monitored target)
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          description: Asset name
        type:
          type: string
          description: |
            Asset type, aligned with the constants defined in
            pkg/asset/asset.go:13-23:
            - task: scheduled task
            - device: generic device
            - host: host
            - port: port
            - website: website
            - service: service
          enum: [task, device, host, port, website, service]
        target:
          type: string
          description: Probe target address
          example: "https://example.com"
        enabled:
          type: boolean
          description: Whether enabled
        config:
          type: object
          description: Asset-specific configuration (timeout, retries, port, etc.)
          additionalProperties: true
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AssetCreateRequest:
      type: object
      required: [name, type, target]
      properties:
        name:
          type: string
          description: Asset name
        type:
          type: string
          description: Asset type
          enum: [task, device, host, port, website, service]
        target:
          type: string
          description: Probe target address
        enabled:
          type: boolean
          description: Whether enabled; defaults to false
        config:
          type: object
          description: Asset-specific configuration
          additionalProperties: true
          nullable: true

    # --- Telemetry monitor schemas ---
    MonitorPoint:
      type: object
      description: Telemetry monitoring point. The wire shape and the
        storage shape are the same model; runtime-managed columns
        (status, interval, timeout) never appear on the wire.
      properties:
        id:
          type: integer
          format: int64
          description: Monitoring point primary key
        name:
          type: string
          description: Display name
        description:
          type: string
          description: Task description
          nullable: true
        asset_type:
          type: string
          description: Category of the monitored asset (e.g. host, service)
          nullable: true
        asset_id:
          type: integer
          format: int64
          description: Optional link to an asset row; metric history and
            logs are surfaced via the history/logs endpoints when set
          nullable: true
        mode:
          type: string
          description: |
            Collection mode:
            - `active`: probes the target on a schedule
            - `passive`: receives data pushed by the target via the report endpoint
          enum: [active, passive]
          example: active
        type:
          type: string
          description: |
            Prober executor type for `active` mode (icmp, tcp, http, udp)
            or listener type for `passive` mode (webhook).
          example: http
        schedule:
          type: string
          description: Probe schedule — a Go duration string (e.g. `60s`)
            or a cron expression. Empty falls back to the runtime default
            interval.
          example: "60s"
          nullable: true
        enabled:
          type: boolean
          description: Whether enabled
        config:
          type: object
          description: |
            Type-specific configuration, persisted as JSON. For an ICMP
            prober it carries the target address; for a webhook listener
            the path and auth settings.
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    MonitorCreateRequest:
      type: object
      required: [name, mode, type]
      properties:
        name:
          type: string
          description: Monitoring point name
        description:
          type: string
          description: Monitoring point description
          nullable: true
        asset_type:
          type: string
          nullable: true
        asset_id:
          type: integer
          format: int64
          nullable: true
        mode:
          type: string
          description: Collection mode (`active` for active probing, `passive` for passive receiving)
          enum: [active, passive]
        type:
          type: string
          description: Prober executor type (active mode) or listener type (passive mode)
          example: icmp
        schedule:
          type: string
          description: Go duration string or cron expression
          nullable: true
        enabled:
          type: boolean
          description: Whether enabled; defaults to true
        config:
          type: object
          nullable: true

    # --- Telemetry report schemas ---

    MonitorSummary:
      type: object
      description: |
        Aggregate monitoring point counts. The mode counts and the enabled
        counts are independent dimensions over the same dataset
        (active + passive = enabled + disabled = total).
      properties:
        active:
          type: integer
          format: int64
          description: Number of active probing points
        passive:
          type: integer
          format: int64
          description: Number of passive receiving points
        enabled:
          type: integer
          format: int64
          description: Number of enabled points across both modes
        disabled:
          type: integer
          format: int64
          description: Number of disabled points across both modes

    MonitorStatus:
      type: object
      description: |
        Runtime status of a monitoring point: the enabled state, a derived
        health status, and — for active points with probe history — the
        latest probe timing and latency.
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        enabled:
          type: boolean
        status:
          type: string
          description: Derived health status
          enum: [active, inactive, error]
        last_probe_at:
          type: string
          format: date-time
          description: Latest probe start time; absent for passive points
          nullable: true
        latency_ms:
          type: integer
          format: int64
          description: Latest probe latency in milliseconds
          nullable: true

    MonitorHistoryEntry:
      type: object
      description: |
        A single historical data point of a monitoring point. Active points
        carry probe latency rows; passive points carry collected metrics.
      properties:
        timestamp:
          type: string
          format: date-time
        value:
          description: Latency in milliseconds (active) or the collected
            metric value (passive)
          nullable: true
        status:
          type: string
          description: Probe result status; empty for passive metric rows
        metric:
          type: string
          description: Names the quantity carried by value — `latency_ms`
            for probe rows, the collected metric name for passive rows

    MonitorLogEntry:
      type: object
      description: A single log line of a monitoring point.
      properties:
        timestamp:
          type: string
          format: date-time
        level:
          type: string
          description: Log severity (passive) or probe status (active)
        message:
          type: string
          description: Log content (passive), or probe error/output (active)

    ExecutorType:
      type: object
      description: Display metadata of a registered executor type.
      properties:
        type:
          type: string
          description: Executor identifier (icmp, tcp, http, ...)
        name:
          type: string
          description: Human-readable display name
        description:
          type: string
          description: Short summary of the capability

    ListenerType:
      type: object
      description: A supported passive monitoring point type.
      properties:
        type:
          type: string
          description: Listener identifier (webhook); populates the type
            field of a passive monitoring point
        name:
          type: string
          description: Human-readable display name
        description:
          type: string
          description: Short summary of the listener capability

    TelemetryTemplate:
      type: object
      description: |
        A monitoring point template. The config is a monitoring point
        configuration payload; applying the template creates a point from
        it. Built-in templates are read-only and cannot be deleted.
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          description: Template name, unique across all templates
        description:
          type: string
          description: Human-readable template description
        category:
          type: string
          description: Template category (e.g. network, web, database)
        executor_type:
          type: string
          description: Probe/executor type (icmp, tcp, http, ...)
        config:
          type: object
          description: Monitoring point configuration payload
          additionalProperties: true
        is_builtin:
          type: boolean
          description: Whether the template is system-seeded and read-only
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TelemetryTemplateRequest:
      type: object
      required: [name, executor_type]
      properties:
        name:
          type: string
          description: Template name
        description:
          type: string
          description: Template description
        category:
          type: string
          description: Template category
        executor_type:
          type: string
          description: Probe/executor type
          example: icmp
        config:
          type: object
          description: Monitoring point configuration payload
          additionalProperties: true

    ApplyTemplateRequest:
      type: object
      description: Request body for applying a template to create a
        monitoring point.
      properties:
        name:
          type: string
          description: Overrides the monitoring point name; empty defaults
            to "<template name> (applied)"
        asset_id:
          type: integer
          format: int64
          description: Optionally links the created point to an asset
          nullable: true
        overrides:
          type: object
          description: Merged into the template config; top-level keys
            replace the corresponding template config keys
          additionalProperties: true

    AlertRule:
      type: object
      description: Alert rule. The wire shape and the storage shape are the
        same model; internal columns (tenant_id, deleted_at) never appear
        on the wire.
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          description: Rule name
        description:
          type: string
          description: Rule description (optional)
        expression:
          type: string
          description: expr-lang source text compiled by the rule engine
          example: metrics["cpu"] > 90
        priority:
          type: integer
          description: Rule ordering; higher values fire first
          default: 0
        group_id:
          type: integer
          format: int64
          description: Resource group visibility; null means tenant-wide
          nullable: true
        metadata:
          type: object
          description: Extension key-value pairs (string to string)
          additionalProperties:
            type: string
          nullable: true
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AlertRuleCreateRequest:
      type: object
      required: [name, expression]
      properties:
        name:
          type: string
        description:
          type: string
        expression:
          type: string
          description: expr-lang source text
        priority:
          type: integer
        group_id:
          type: integer
          format: int64
          nullable: true
        metadata:
          type: object
          additionalProperties:
            type: string
          nullable: true
        enabled:
          type: boolean

    AlertRecord:
      type: object
      description: Alert history record
      properties:
        id:
          type: integer
          format: int64
        rule_id:
          type: integer
          format: int64
          description: ID of the rule that triggered this record
        rule_name:
          type: string
          description: Rule name snapshot
        severity:
          type: string
          description: Severity level (from the rule snapshot)
          enum: [info, warning, critical]
        value:
          type: number
          format: double
          description: Actual metric value at trigger time
        status:
          type: string
          description: Alert status
          enum: [firing, acknowledged, resolved]
        message:
          type: string
          description: Alert message
        triggered_at:
          type: string
          format: date-time
          description: Trigger time
        acknowledged_at:
          type: string
          format: date-time
          description: Acknowledgement time; null if not acknowledged
          nullable: true
        resolved_at:
          type: string
          format: date-time
          description: Resolution time; null if not resolved
          nullable: true

    # --- System schemas ---
    SystemConfig:
      type: object
      description: System configuration
      properties:
        logLevel:
          type: string
          description: Log level
          enum: [debug, info, warn, error]
        defaultLang:
          type: string
          description: Default language code
          example: zh-Hans
        retentionDays:
          type: integer
          description: Data retention days
          example: 30

    SystemInfo:
      type: object
      description: Runtime system information
      properties:
        version:
          type: string
          description: System version number
        buildTags:
          type: string
          description: Build tags
        startTime:
          type: string
          format: date-time
          description: Process start time
        uptime:
          type: string
          description: Uptime (human-readable)

    CertificateReloadResponse:
      type: object
      description: Certificate reload response
      properties:
        fingerprint:
          type: string
          description: SHA-256 fingerprint of the newly loaded leaf certificate (lowercase hex, 64 characters)
          example: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08

    ExecutionStats:
      type: object
      description: Aggregated task execution statistics within a time range
      properties:
        total_executions:
          type: integer
          description: Total executions in the time range
        success_count:
          type: integer
          description: Executions with normal/success status
        failure_count:
          type: integer
          description: Executions with abnormal/failure status
        success_rate:
          type: number
          format: double
          description: Success rate as percentage (0-100)
        average_duration_ms:
          type: number
          format: double
          description: Average execution duration in milliseconds

    GlobalStats:
      type: object
      description: Global system statistics
      properties:
        total_tasks:
          type: integer
          description: Total number of tasks
        total_devices:
          type: integer
          description: Total number of device-type assets
        today_executions:
          type: integer
          description: Number of executions in the current day
        today_success_rate:
          type: number
          format: double
          description: Today's success rate as percentage (0-100)

    AssetStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [normal, abnormal, offline, unknown]
          description: The manual status to set.

    AssetProbeResult:
      type: object
      properties:
        asset_id:
          type: integer
          format: int64
          description: ID of the probed asset.
        status:
          type: string
          description: Status determined by the probe.

    ExprValidateRequest:
      type: object
      required: [env]
      properties:
        env:
          type: string
          enum: [alert, remediation, execution]
          description: Evaluation environment whose variable contract the expression is compiled against.
        expression:
          type: string
          description: The expr-lang predicate. Required for env=alert; remediation and execution accept an empty expression (no filter).

    ExprValidateResponse:
      type: object
      properties:
        valid:
          type: boolean
          description: True when the expression compiles and evaluates cleanly against the env's example payload.

    UserProfile:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        nickname:
          type: string
        email:
          type: string
        role:
          type: integer
          description: Numeric role (1 = admin).
        language:
          type: string
          description: Preferred UI locale (BCP 47 tag).
        alert_format_style:
          type: string
          description: Preferred alert rendering style.

    UpdateProfileRequest:
      type: object
      description: Partial update; only the fields present are applied.
      properties:
        nickname:
          type: string
        email:
          type: string
        language:
          type: string
        alert_format_style:
          type: string

    Channel:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          description: Human-readable channel name.
        type:
          type: string
          description: Channel type (email, webhook, ...).
        config:
          type: string
          description: Channel-type-specific configuration (JSON string).
        enabled:
          type: boolean
        last_used_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ChannelRequest:
      type: object
      required: [name, type, config]
      properties:
        name:
          type: string
        type:
          type: string
        config:
          type: string
          description: Channel-type-specific configuration (JSON string).
        enabled:
          type: boolean

    RemediationRule:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        asset_id:
          type: integer
          format: int64
          description: Asset the rule is scoped to (0 = no asset scope).
        trigger_event_type:
          type: string
          enum: [metric, log, status_change]
          description: Event type that activates the rule.
        expression:
          type: string
          description: Optional expr-lang predicate applied to the trigger event.
        executor_type:
          type: string
          description: Executor dispatched when the rule fires.
        executor_config:
          type: string
          description: Executor configuration (JSON string).
        cooldown:
          type: integer
          description: Minimum seconds between two dispatches of this rule.
        circuit_breaker_threshold:
          type: integer
          description: Consecutive failures before the circuit breaker pauses the rule.
        enabled:
          type: boolean
        status:
          type: string
          enum: [active, paused]
        last_run_at:
          type: string
          format: date-time
          nullable: true
        consecutive_failures:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    RemediationRuleRequest:
      type: object
      required: [name, trigger_event_type, executor_type]
      properties:
        name:
          type: string
        description:
          type: string
        asset_id:
          type: integer
          format: int64
        trigger_event_type:
          type: string
          enum: [metric, log, status_change]
        expression:
          type: string
        executor_type:
          type: string
        executor_config:
          type: string
        cooldown:
          type: integer
        circuit_breaker_threshold:
          type: integer
        enabled:
          type: boolean

    RemediationRecord:
      type: object
      properties:
        id:
          type: integer
          format: int64
        rule_id:
          type: integer
          format: int64
        rule_name:
          type: string
          description: Denormalized snapshot of the rule name at trigger time.
        asset_id:
          type: integer
          format: int64
          description: Numeric asset identifier of the triggering event (0 = no asset scope).
        asset_key:
          type: string
          description: Asset key of the triggering event, when the payload carried one.
        run_id:
          type: string
          description: Unique identifier of this remediation run.
        trigger:
          type: string
          description: Trigger type that activated the rule (metric, log, status_change).
        status:
          type: string
          description: Dispatch lifecycle state (triggered, running, success, failed, skipped).
        error:
          type: string
          description: Failure or skip message, when status is failed or skipped.
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    LocaleInfo:
      type: object
      properties:
        tag:
          type: string
          description: Canonical BCP 47 tag with standard casing (e.g. "zh-Hans").
        language:
          type: string
          description: Primary language subtag, lowercase (e.g. "zh").
        region:
          type: string
          description: Region subtag without the leading dash, uppercase; empty when the locale has no region.
        direction:
          type: string
          enum: [ltr, rtl]
        native_name:
          type: string
          description: Locale name rendered in its own language.

