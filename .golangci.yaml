version: "2"

run:
  go: "1.26"

linters:
  enable:
    - misspell
  settings:
    errcheck:
      check-type-assertions: true
  exclusions:
    rules:
      - linters:
          - errcheck
        path: _test\.go

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
