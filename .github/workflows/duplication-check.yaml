name: Duplication Check

on:
  push:
    branches: [main, devel]
  pull_request:
    branches: [main, devel]

permissions:
  contents: read

concurrency:
  group: duplication-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Gate: block the scan job until CLA is signed.
  cla-gate:
    name: CLA Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
      - uses: ./.github/actions/check-cla
        id: cla
      - name: Fail if CLA is not signed
        if: steps.cla.outputs.signed != 'true'
        run: |
          echo "::error::Contributor License Agreement not signed by: ${{ steps.cla.outputs.unsigned }}"
          echo "Sign the CLA by replying to the pull request with:"
          echo "  I agree to the terms of the Tickraft Contributor License Agreement."
          exit 1

  duplication-check:
    name: Code Duplication Detection
    needs: cla-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
      - name: Install jscpd
        run: npm install -g jscpd
      - name: Run duplication detection
        run: |
          echo "Checking code duplication between internal/ and pkg/ directories..."
          # jscpd v5 CLI: --format selects the languages/formats to scan,
          # --reporters selects the output reporter (the old --languages and
          # --reporter flags were removed). Test files are excluded because
          # they contain shared test-setup boilerplate that is not production
          # duplication; without this exclusion the check reports 6.4%
          # instead of the production-only 2.3%.
          jscpd \
            --format go \
            --min-tokens 50 \
            --min-lines 5 \
            --reporters json \
            --output ./jscpd-report \
            --ignore "**/*_test.go" \
            internal/ pkg/
      - name: Check duplication threshold
        run: |
          DUPLICATION=$(cat ./jscpd-report/jscpd-report.json | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          total = data.get('statistics', {}).get('total', {})
          percentage = total.get('percentage', '0%')
          if isinstance(percentage, str):
              percentage = percentage.replace('%', '')
          print(percentage)
          ")
          echo "Duplication between internal/ and pkg/: ${DUPLICATION}%"
          THRESHOLD=5
          if [ "$(echo "$DUPLICATION > $THRESHOLD" | bc -l)" -eq 1 ]; then
            echo "FAIL: Duplication ${DUPLICATION}% exceeds threshold ${THRESHOLD}%"
            echo ""
            echo "Duplication details:"
            cat ./jscpd-report/jscpd-report.json | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for d in data.get('duplicates', []):
              first = d.get('firstFile', {})
              second = d.get('secondFile', {})
              print(f\"  {first.get('name')}:{first.get('start')}-{first.get('end')} <-> {second.get('name')}:{second.get('start')}-{second.get('end')} ({d.get('lines')} lines, {d.get('tokens')} tokens)\")
          "
            exit 1
          fi
          echo "PASS: Duplication ${DUPLICATION}% is within threshold ${THRESHOLD}%"

      - name: Upload duplication report
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0b9a81f7
        with:
          name: jscpd-report
          path: ./jscpd-report/
