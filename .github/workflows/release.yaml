name: Release

# Triggered when a semantic version tag (v*) is pushed.
# Builds cross-platform binaries via GoReleaser, creates a GitHub Release
# with archives and checksums, and publishes a Docker image to GHCR.
#
# The release jobs depend on the CI workflow passing for the tagged commit,
# so a tag on code that fails lint/tests/license checks will not produce
# release artifacts.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write  # GoReleaser needs this to create the GitHub Release
  packages: write  # needed to push the Docker image to GHCR
  actions: read    # needed to check CI workflow status via workflow_run

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:

  # ─────────────────────────────────────────────────────────────
  # Gate: verify CI passed for the tagged commit before releasing.
  # ─────────────────────────────────────────────────────────────
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      ci_passed: ${{ steps.check.outputs.passed }}
    steps:
      - name: Verify CI passed for this tag
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA="${{ github.sha }}"
          echo "Checking CI status for commit $SHA..."
          # The CI workflow runs on push to main/devel; a tag push does not
          # trigger it directly, so we inspect the most recent CI run for the
          # tagged commit and require it to be completed successfully.
          STATUS=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yaml/runs?head_sha=$SHA&per_page=10" --jq '.workflow_runs[0].status // empty')
          CONCLUSION=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yaml/runs?head_sha=$SHA&per_page=10" --jq '.workflow_runs[0].conclusion // empty')
          echo "CI status: ${STATUS:-none}; conclusion: ${CONCLUSION:-none}"
          if [ "$STATUS" != "completed" ]; then
            echo "::error::CI is still in progress for commit $SHA. Release aborted."
            echo "passed=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if [ "$CONCLUSION" = "success" ]; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::CI has not passed for commit $SHA (conclusion: ${CONCLUSION:-none}). Release aborted."
            echo "passed=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

  # ─────────────────────────────────────────────────────────────
  # Job 1: Build cross-platform binaries + create GitHub Release
  # ─────────────────────────────────────────────────────────────
  release-binaries:
    name: Release Binaries
    needs: ci-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0  # GoReleaser needs full history for changelog

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26'

      - name: Set up pnpm
        uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3
        with:
          version: 9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build frontend assets
        run: |
          cd web
          pnpm install --frozen-lockfile
          pnpm build
          test -d app/dist || { echo "ERROR: web/app/dist not produced by frontend build"; exit 1; }

      - name: Stage frontend assets for Go embed
        run: |
          rm -rf internal/web/dist
          mkdir -p internal/web/dist
          cp -r web/app/dist/. internal/web/dist/
          touch internal/web/dist/.gitkeep

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────────────────────
  # Job 2: Build and push Docker image to GHCR
  # Depends on release-binaries so the Go binary is already built and
  # verified (the Dockerfile embeds it via multi-stage build).
  # ─────────────────────────────────────────────────────────────
  release-docker:
    name: Release Docker Image
    needs: release-binaries
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f7ce87c1d6bead3e36075b2ce75da1f6cc28aaca

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/tickraft-ce:latest
            ghcr.io/${{ github.repository_owner }}/tickraft-ce:${{ steps.version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
