name: Release

# Triggered when a semantic version tag (v*) is pushed.
# Builds cross-platform binaries via GoReleaser, creates a GitHub Release
# with archives and checksums, and publishes a Docker image to GHCR.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write  # GoReleaser needs this to create the GitHub Release
  packages: write  # needed to push the Docker image to GHCR

jobs:

  # ─────────────────────────────────────────────────────────────
  # Job 1: Build cross-platform binaries + create GitHub Release
  # ─────────────────────────────────────────────────────────────
  release-binaries:
    name: Release Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # GoReleaser needs full history for changelog

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8

      - name: Build frontend assets
        run: |
          cd web
          pnpm install --frozen-lockfile
          pnpm build
          test -d app/dist || { echo "ERROR: web/app/dist not produced by frontend build"; exit 1; }

      - name: Stage frontend assets for Go embed
        run: |
          rm -rf internal/web/dist
          mkdir -p internal/web/dist
          cp -r web/app/dist/. internal/web/dist/
          touch internal/web/dist/.gitkeep

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────────────────────
  # Job 2: Build and push Docker image to GHCR
  # ─────────────────────────────────────────────────────────────
  release-docker:
    name: Release Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/tickraft/tickraft-ce:latest
            ghcr.io/tickraft/tickraft-ce:${{ steps.version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
