name: CI

on:
  push:
    branches: [main, devel]
  pull_request:
    branches: [main, devel]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # CLA gate: runs before every other job so unsigned pull requests do not
  # consume backend/frontend runner minutes. On push events (no pull request
  # payload) the check passes and downstream jobs proceed. The composite
  # action is checked out from the pull request's BASE ref so a fork PR
  # cannot tamper with the verification logic to bypass the gate.
  cla-gate:
    name: CLA Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
      - uses: ./.github/actions/check-cla
        id: cla
      - name: Fail if CLA is not signed
        if: steps.cla.outputs.signed != 'true'
        run: |
          echo "::error::Contributor License Agreement not signed by: ${{ steps.cla.outputs.unsigned }}"
          echo "Sign the CLA by replying to the pull request with:"
          echo "  I agree to the terms of the Tickraft Contributor License Agreement."
          exit 1

  # Go lint and test
  backend:
    name: Backend Lint & Test
    needs: cla-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@d583c34f0599d37dbac4a198b9c83201be380893
        with:
          version: v2.4.0
      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...
      - name: Check coverage
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: ${COVERAGE}%"
          # pkg packages should have >= 70% coverage once implemented
          # For now, just report
      - name: Build
        run: go build ./...

  # Open-source red line scan: ensure professional edition keywords do NOT
  # leak into the open-source codebase.
  # Only git-tracked files are scanned (git grep). This automatically excludes
  # node_modules/, dist/, .git/ and any other ignored build artifacts, which
  # previously flooded the scan with third-party package content. The
  # web/pnpm-lock.yaml lockfile and the auto-generated web/app/components.d.ts
  # are explicitly excluded because they reference third-party package names
  # (e.g. prettier -> "tier") that legitimately contain scanned substrings.
  red-line-scan:
    name: Open Source Red Line Scan
    needs: cla-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Scan for restricted keywords
        run: |
          echo "Scanning for restricted keywords in open-source codebase..."
          FOUND=0

          # Whitelist of legitimate SPI contract identifiers, dual-license
          # vocabulary and standard technical terms. Lines matching these
          # identifiers are excluded from the red-line scan to avoid false
          # positives blocking CI. Matching is case-insensitive so both
          # camelCase and PascalCase variants are covered.
          #
          # SPI contract identifiers:
          #   TenantID / tenant_id / Tenant - multi-tenant isolation model
          #   SSOProvider / SSO / pkg/auth/sso - open-source SSO provider SPI
          #   AccountResolver / AccountStore - interfaces in auth extension SPI
          #   Processor - data processor SPI in collector (contains "sso")
          #   DefaultQuota - default resource quota constants
          #   cmd/tickraft/version - build edition variable
          #
          # Dual-license vocabulary (core to this repository):
          #   AGPL / AGPLv3 / LICENSE / dual license - dual-license model
          #   Commercial License / COMMERCIAL.txt - commercial license side
          #   commercial edition / commercial repository / commercial plugin /
          #   commercial users / commercial license inquiries - license docs
          #
          # Standard technical terms (not edition-specific):
          #   business logic / business code / business service - app layer terms
          #   open_source / open-source edition / extended edition /
          #   extended-edition / running edition - neutral edition descriptors
          #   oidc / saml - standard authentication protocols
          #   stripe / striped / tk-bg-stripe / stripe overlay / stripe/hover /
          #   el-table__row--striped - el-table striped table rows
          #   Enterprise tier / Personal tier / personal account /
          #   personal appearance / personal or political / (personal) -
          #   feature-tier SPI docs and neutral personal references
          WHITELIST_PATTERN='TenantID|tenant_id|SSOProvider|SSO|pkg/auth/sso|AccountResolver|AccountStore|Processor|Tenant|cmd/tickraft/version|DefaultQuota|AGPL|Commercial License|dual license|AGPLv3|LICENSE|business logic|business code|business service|open_source|open-source edition|extended edition|extended-edition|running edition|oidc|saml|el-table__row--striped|tk-bg-stripe|stripe overlay|stripe/hover|striped|stripe$|commercial edition|commercial users|commercial plugin|commercial repository|commercial license inquiries|COMMERCIAL\.txt|Enterprise tier|personal appearance|personal or political|personal account|\(personal\)|Personal tier'

          # Distinctive pro-edition identifiers: these tokens only appear in
          # commercial/SaaS code and have no legitimate meaning in the
          # open-source codebase (the whitelist above documents the few
          # legitimate exceptions). Common English words that were previously
          # scanned (license/business/account/quota/subscription/billing/
          # payment/tier/team/variant) are omitted because they are pervasive
          # in legitimate open-source content (pub/sub event bus, error-code
          # docs, the internal/quota module, feature-tier SPI docs) and made
          # the scan unusable.
          # Markdown files are included so SaaS build instructions and pro
          # schema docs in docs/ cannot escape the red-line scan. The
          # docs/audit/ directory is excluded because it documents violations
          # and must reference restricted keywords by design.
          # Note: "oidc" and "saml" are omitted from the scan list because
          # they are also in the whitelist (as standard authentication
          # protocols), so scanning for them can never produce a violation.
          # Similarly, "sso" and "tenant" word-boundary scans are omitted
          # because SSO/Tenant appear in the whitelist as SPI identifiers.
          for keyword in "stripe" "alipay" "wechat_pay" "mqtt_broker" "auto_recovery" "ssh_client" "saas" "commercial" "enterprise" "personal"; do
            if git grep -i -n -e "$keyword" -- '*.go' '*.ts' '*.vue' '*.yaml' '*.yml' '*.md' ':(exclude).github/**' ':(exclude)docs/audit/**' ':(exclude)web/pnpm-lock.yaml' ':(exclude)web/app/components.d.ts' | grep -viE "$WHITELIST_PATTERN"; then
              echo "ERROR: Found restricted keyword '$keyword' in open-source codebase"
              FOUND=1
            fi
          done

          if [ $FOUND -eq 1 ]; then
            echo "FAIL: Restricted keywords detected in open-source repository"
            exit 1
          fi
          echo "PASS: No restricted keywords found"

  # License header presence check: every eligible source file must carry
  # the standardized 3-line AGPLv3 + Commercial dual-license header.
  license-headers:
    name: License Header Check
    needs: cla-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify license headers
        run: make license-header

  # Frontend lint and build
  frontend:
    name: Frontend Lint & Build
    needs: cla-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # The web/ directory is a pnpm workspace (pnpm-workspace.yaml +
      # pnpm-lock.yaml), so pnpm must be installed and used instead of npm.
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a
        with:
          version: 9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install dependencies
        run: |
          cd web
          pnpm install --frozen-lockfile
      - name: Type check
        run: |
          cd web
          pnpm run type-check
      - name: Build
        run: |
          cd web
          pnpm build
