name: CLA

# Requires every contributor to sign the Tickraft Contributor License
# Agreement before their pull request can be merged.
#
# How it works:
#   - Runs on pull_request_target so it executes with base-repository
#     permissions (can comment on and label fork PRs) without checking out
#     or executing any fork code.
#   - Verification is delegated to the shared .github/actions/check-cla
#     composite action (the same action the CI cla-gate job uses), so the
#     signer-matching logic lives in exactly one place.
#   - Contributors sign themselves by replying to the PR with:
#       I agree to the terms of the Tickraft Contributor License Agreement.
#     The cla-sign workflow validates and records the signature
#     automatically — no maintainer action required.
#   - If anyone is unsigned, this job posts signing guidance, applies the
#     cla-required label, and fails so branch protection can block merge.
#   - Once every contributor is recorded as signed, it applies the
#     cla-signed label and the check passes.
#
# Registry: the signer registry lives on the dedicated cla-signatures
# branch. Recommended branch ruleset for that branch so other users cannot
# tamper with signatures while the signing workflow keeps working:
#   - "Require a pull request before merging" -> gates human pushes
#   - Bypass list: add the dedicated CLA GitHub App (by name) -> lets the
#     cla-sign workflow push via the app's installation token
#   - Restrict force pushes and deletions
# GITHUB_TOKEN cannot bypass a "require a pull request" rule, which is why
# the cla-sign workflow authenticates as the GitHub App instead.
#
# Branch protection: require this "Contributor License Agreement" job in
# the branch protection rule so unsigned pull requests cannot merge.

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write

# Serialize CLA checks per PR: label toggles (add + remove) fire two events,
# and synchronize/ready_for_review can overlap. Runs are idempotent so
# canceling a pending duplicate is safe and avoids redundant API calls.
concurrency:
  group: cla-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cla-check:
    name: Contributor License Agreement
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Check out the base ref (pull_request_target default) so the local
      # check-cla composite action is loaded from trusted base-branch code.
      # The action reads PR data via the API and never executes fork code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: ./.github/actions/check-cla
        id: cla

      - name: Manage CLA labels and status comment
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        env:
          CLA_SIGNED: ${{ steps.cla.outputs.signed }}
          CLA_UNSIGNED: ${{ steps.cla.outputs.unsigned }}
        with:
          script: |
            const { owner, repo } = context.repo
            const pr = context.payload.pull_request
            const prNumber = pr.number
            const marker = '<!-- tickraft-cla -->'

            const allSigned = process.env.CLA_SIGNED === 'true'
            const unsigned = (process.env.CLA_UNSIGNED || '').split(',').filter(Boolean)
            console.log(`all signed: ${allSigned}; unsigned: ${unsigned.join(', ') || '(none)'}`)

            const claDoc = `https://github.com/${owner}/${repo}/blob/main/CLA.md`
            const claZhDoc = `https://github.com/${owner}/${repo}/blob/main/CLA.zh-CN.md`

            // 1. Manage the cla-signed / cla-required labels.
            const { data: issueLabels } = await github.rest.issues.listLabelsOnIssue({ owner, repo, issue_number: prNumber })
            const hasLabel = (name) => issueLabels.some((l) => l.name === name)
            if (allSigned) {
              if (!hasLabel('cla-signed')) {
                await github.rest.issues.addLabels({ owner, repo, issue_number: prNumber, labels: ['cla-signed'] })
              }
              if (hasLabel('cla-required')) {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: prNumber, name: 'cla-required' })
              }
            } else {
              if (!hasLabel('cla-required')) {
                await github.rest.issues.addLabels({ owner, repo, issue_number: prNumber, labels: ['cla-required'] })
              }
              if (hasLabel('cla-signed')) {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: prNumber, name: 'cla-signed' })
              }
            }

            // 2. Upsert the CLA status comment (idempotent via the marker).
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: prNumber })
            const existing = comments.find((c) => c.body && c.body.includes(marker))
            const body = allSigned
              ? `${marker}\n✅ **CLA verified** — all contributors have signed the Tickraft Contributor License Agreement. Thank you!`
              : `${marker}\n### 📝 Contributor License Agreement required\n\n` +
                `Before this pull request can be merged, every contributor must sign the Tickraft Contributor License Agreement (CLA).\n\n` +
                `The following account(s) have not signed yet: **${unsigned.join(', ')}**\n\n` +
                `**How to sign:** reply to this pull request with:\n\n` +
                `> I agree to the terms of the Tickraft Contributor License Agreement.\n\n` +
                `Your signature is recorded automatically — no maintainer action is needed.\n\n` +
                `- Read the agreement: [CLA.md](${claDoc}) · [CLA.zh-CN.md](${claZhDoc})\n` +
                `- For questions, contact a maintainer or open an issue.`
            if (existing) {
              if (existing.body !== body) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body })
              }
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body })
            }

      # Fail the check while anyone is unsigned so branch protection can
      # require this job before allowing a merge.
      - name: Block merge until CLA is signed
        if: steps.cla.outputs.signed != 'true'
        run: |
          echo "::error::Contributor License Agreement not signed — see the CLA comment on this pull request."
          exit 1
