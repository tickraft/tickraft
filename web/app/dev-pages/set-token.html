<!DOCTYPE html>
<html>
<head><title>Set Token</title></head>
<body>
<p>Setting token...</p>
<script>
  // Set auth token and locale in localStorage (same origin as the app)
  localStorage.setItem('tk-token', JSON.stringify('mock-jwt-token-' + Date.now()));
  localStorage.setItem('tk-locale', JSON.stringify('en-US'));
  document.title = 'Token set';
</script>
</body>
</html>
